name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        python: ['3.9', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (no privileged operations or real disks)
        run: python -m unittest discover -s tests -v
      - name: Shell syntax
        run: |
          for script in Install.command scripts/*.sh; do
            bash -n "$script"
          done
      - name: CLI help
        run: python -m ntfs_ready --help
      - name: Build source-only release
        run: python tools/build_release.py --output dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-release-${{ matrix.os }}-python-${{ matrix.python }}
          path: dist/*
  desktop:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Native model tests (no GUI actions or disks)
        run: |
          xcrun swiftc -parse-as-library -swift-version 5 native/NTFSReady/Models.swift native/tests/ModelTests.swift -o "$RUNNER_TEMP/ntfs-ready-model-tests"
          "$RUNNER_TEMP/ntfs-ready-model-tests"
      - name: Build and verify native desktop bundle
        run: |
          python tools/build_desktop.py
          codesign --verify --deep --strict 'dist/NTFS Ready.app'
          ditto -c -k --keepParent 'dist/NTFS Ready.app' dist/NTFS-Ready-Desktop-CI.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-desktop-ci-build
          path: dist/NTFS-Ready-Desktop-CI.zip
