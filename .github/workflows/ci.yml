name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        python: ['3.9', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (no privileged operations or real disks)
        run: python -m unittest discover -s tests -v
      - name: Shell syntax
        run: |
          for script in Install.command scripts/*.sh; do
            bash -n "$script"
          done
      - name: CLI help
        run: python -m ntfs_ready --help
      - name: Build source-only release
        run: python tools/build_release.py --output dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-release-${{ matrix.os }}-python-${{ matrix.python }}
          path: dist/*
